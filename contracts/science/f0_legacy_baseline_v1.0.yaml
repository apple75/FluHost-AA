contract:
  id: F0_LEGACY_BASELINE
  version: "1.0"
  status: draft
  contract_type: scientific
  phase: F0

objective:
  primary: >
    Faithfully reproduce the historical thesis baseline using available
    historical data, methods, records and outputs.

  modernization_allowed: false

principles:
  preserve_documented_historical_choices: true
  infer_missing_scientific_parameters: false
  replace_historical_methods_with_modern_defaults: false
  record_discrepancies: true
  separate_reproduction_from_modernization: true

